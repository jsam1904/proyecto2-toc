services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      # Necesario para que --reload detecte cambios en volúmenes montados desde Windows.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./motor:/app/motor
      - ./backend:/app/backend
      - ./gramaticas:/app/gramaticas

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
